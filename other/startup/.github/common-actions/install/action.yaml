name: 'install'
description: 'Sets up Node.js and runs install'

runs:
  using: 'composite'
  steps:
    - name: 🚀 Setup pnpm
      uses: pnpm/action-setup@v4
    # No `registry-url` here: it makes setup-node write an `_authToken=${NODE_AUTH_TOKEN}` .npmrc
    # with a placeholder token, which interferes with npm Trusted Publishing (OIDC).
    - name: 🟢 Setup node
      uses: actions/setup-node@v4.0.2
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: 🤖 Setup Git User
      shell: bash
      run: |
        git config --global user.email "ineedjobtostartwork@gmail.com"
        git config --global user.name "INEEDJ"
    - name: ↘️ Install dependencies
      shell: bash
      run: pnpm install --no-frozen-lockfile
