name: Publish Package to npmjs
on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: 🟢 Setup
        uses: ./.github/common-actions/install

      - name: ⬆️ Update npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version

      # TEMP DEBUG: npm hides OIDC exchange failures (logged only at `verbose`) and then fails with ENEEDAUTH.
      # This step performs the same exchange manually and prints the registry's answer. Remove once publishing works.
      - name: 🔍 Debug npm Trusted Publishing (OIDC)
        continue-on-error: true
        run: |
          ID_TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$ID_TOKEN"
          echo "--- OIDC claims GitHub sends to npm (must match Trusted Publisher settings) ---"
          node -e 'const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url"));const {repository,repository_owner,repository_visibility,workflow_ref,job_workflow_ref,environment,ref,event_name}=p;console.log(JSON.stringify({repository,repository_owner,repository_visibility,workflow_ref,job_workflow_ref,environment:environment??"(none)",ref,event_name},null,2))' "$ID_TOKEN"
          for PKG in @ineedj/eslintrc @ineedj/prettierrc; do
            echo "--- token exchange for $PKG ---"
            curl -sS -w '\nHTTP %{http_code}\n' -X POST \
              -H "Authorization: Bearer $ID_TOKEN" -H "Content-Type: application/json" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PKG/\//%2f}" \
              | sed -E 's/"token":"[^"]+"/"token":"***"/'
          done

      # Auth to npm goes through OIDC (Trusted Publishing) - no NPM_TOKEN needed.
      # Each package must have this repo + "publish.yml" set as Trusted Publisher on npmjs.com.
      - name: 🗨️ Create Release Pull Request or Publish to NPM
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm npm:publish --no-git-checks --tag latest
          title: '🤖 ci(changesets): :package: version packages'
          commit: '🤖 ci(changesets): version packages'
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
